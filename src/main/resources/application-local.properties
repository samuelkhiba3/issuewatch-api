server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/issuewatch_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:MySQL}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

app.upload.dir=${APP_UPLOAD_DIR:uploads}

app.jwt.secrete=${JWT_SECRETE:your-super-long-secret-key-that-is-at-least-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls-enable=true

app.mail.from=${MAIL_FROM:no-reply@issuewatch.local}
app.mail.enabled=${MAIL_ENABLED:false}

jobs.enabled=${JOBS_ENABLED:true}
jobs.refresh-token-cleanup-ms=${REFRESH_TOKEN_CLEANUP_MS:3600000}
jobs.issue-reminder-ms=${ISSUE_REMINDER_MS:3600000}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha