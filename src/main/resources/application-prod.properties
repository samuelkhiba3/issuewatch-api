server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/issuewatch_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX-REQUEST-SIZE:20MB}

app.upload.dir=${APP_UPLOAD_DIR:/app/upload}

app.jwt.secrete=${JWT_SECRETE}
app.jwt.expiration-ms=${JWT_SECRETE_MS:900000}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls-enable=true
app.mail.from=${MAIL_FROM}

jobs.enabled=${JOBS_ENABLE:true}

server.forward-headers-strategy=framework