services:
  mysql:
    image: mysql:8.4
    container_name: issuewatch-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: issuewatch_db
      MYSQL_USER: issuewatch_user
      MYSQL_PASSWORD: issuewatch_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - issuewatch_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "issuewatch_user", "-pissuewatch_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: issuewatch-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/issuewatch_db
      DB_USERNAME: issuewatch_user
      DB_PASSWORD: issuewatch_password
      JWT_SECRET: your-super-long-secret-key-that-is-at-least-32-characters
      JWT_EXPIRATION_MS: 900000
      APP_UPLOAD_DIR: /app/uploads
      MAIL_ENABLED: false
      JOBS_ENABLED: true
      REFRESH_TOKEN_CLEANUP_MS: 3600000
      ISSUE_REMINDER_MS: 3600000
    ports:
      - "8080:8080"
    volumes:
      - issuewatch_uploads:/app/uploads

volumes:
  issuewatch_mysql_data:
  issuewatch_uploads: